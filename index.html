<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Resume & Job Matcher</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <header>
            <h1>AI Resume & Job Matcher</h1>
            <p>Analyze your resume and discover how well it matches a job.</p>
        </header>

        <div class="card">

            <label>Upload Resume</label>
            <input type="file" id="resume" accept=".pdf">

            <label>Job Description</label>
            <textarea
                id="jobDescription"
                placeholder="Paste the job description here..."
            ></textarea>

            <button onclick="analyzeResume()">Analyze Resume</button>

        </div>

        <div id="result" class="result hidden">

            <h2>Analysis Result</h2>

            <div class="score">
                <span id="matchScore">0%</span>
                <p>Match Score</p>
            </div>

            <div class="skills">
                <div>
                    <h3>✅ Matched Skills</h3>
                    <ul id="matchedSkills"></ul>
                </div>

                <div>
                    <h3>❌ Missing Skills</h3>
                    <ul id="missingSkills"></ul>
                </div>
            </div>

        </div>
        <div class="suggestions">
    <h3>💡 Improvement Suggestions</h3>
    <ul id="suggestionsList"></ul>
</div>

    </div>

    <script src=script.js"></script>

</body>
</html>
